<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./practice10-regular.css" />
  </head>
  <body>
    <h1>회원가입</h1>
    <h3 class="q1">영문자로 시작하고 영문자와 숫자 조합으로 4~12자 이내</h3>
    <h3 class="q2">영문자, 숫자, 특수문자 조합으로 8~15자 이내</h3>
    <h3 class="q3">위 비밀번호와 동일하게</h3>
    <h3 class="q4">한글 2자 이상</h3>
    <h3 class="q5">이메일 형식</h3>
    <h3 class="q6">전화번호 형식</h3>
    <div class="Id"></div>
    <div class="Id2">
      <input type="text" placeholder="아이디를 입력해주세요" />
    </div>
    <div class="Id3">
      <input type="text" placeholder="비밀번호를 입력해주세요" />
    </div>
    <div class="Id4">
      <input type="text" placeholder="비밀번호를 다시 한 번 입력해주세요" />
    </div>
    <div class="Id5">
      <input type="text" placeholder="이름을 입력해주세요" />
    </div>
    <div class="Id6">
      <input type="text" placeholder="이메일을 입력해주세요" />
    </div>
    <div class="Id7">
      <input type="text" placeholder="전화번호를 입력해주세요" />
    </div>
    <div class="btnBox">
      <button id="submitBtn">가입하기</button>
      <button id="resetBtn">취소</button>
    </div>
    <script src="./practice10-regular.js"></script>
  </body>
</html>
