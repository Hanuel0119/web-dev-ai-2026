<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>버튼 컴포넌트</h2>
    <button class="btn" disabled>Button</button>
    <a class="btn btn--red" href="">A Button</a>
    <div class="btn btn--ghost">Div Button</div>
    <button class="btn btn--blue">결제하기</button>
    <button class="btn">취소</button>

    <h2>카드 컴포넌트</h2>
    <div class="card">
        <img src="../assets/content.jpg" class="card__media">
        <div class="card__media"></div>
        <div class="card__body">
            <!-- BEM(Block__Element--Modifier) 
                 - Block : 재사용 가능한 블록 (상위 태그)
                 - Element : 블록에 종속하는 하위요소 (하위 태그들)
                 - Modifier : 블록이나 엘리먼트의 변형 또는 속성 (모양, 상태 등)을 의미
            -->
            <div class="card__title card__title--thin">Lorem Ipsum</div>
            <div class="card__text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Tenetur blanditiis numquam error quam quod ipsa optio ex aliquid harum, dignissimos reiciendis odit accusamus provident asperiores, eos dolorum architecto sapiente aliquam?</div>
        </div>
    </div>
</body>
</html>
